<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Workout Path">
<meta name="theme-color" content="#F6F5F3" media="(prefers-color-scheme: light)" data-for="light">
<meta name="theme-color" content="#0C0B0A" media="(prefers-color-scheme: dark)" data-for="dark">
<script>
/* Light or dark, and the style, before the first paint: this device's choices, else the system's mode and Classic.
   src/lib/theme.ts does the same afterwards (the Bear backgrounds here match its BARS). */
(function () {
  var root = document.documentElement, t, st;
  try { t = localStorage.getItem("workoutPath.theme"); st = localStorage.getItem("workoutPath.style"); } catch (e) {}
  root.dataset.style = st === "bear" ? "bear" : "classic";
  var metas = document.querySelectorAll('meta[name="theme-color"][data-for]');
  if (st === "bear") metas.forEach(function (m) { m.content = m.dataset.for === "dark" ? "#1F2022" : "#F3F5F7"; });
  if (t !== "light" && t !== "dark") return void (root.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  root.dataset.theme = t;
  metas.forEach(function (m) { m.media = m.dataset.for === t ? "all" : "not all"; });
})();
</script>
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="manifest" href="./manifest.webmanifest">
<title>Workout Path</title>
</head>
<body>
<div id="root"></div>
<script type="module" src="./src/main.tsx"></script>
</body>
</html>
