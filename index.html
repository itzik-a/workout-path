<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Workout Path">
<meta name="theme-color" content="#F6F5F3" media="(prefers-color-scheme: light)" data-for="light">
<meta name="theme-color" content="#0C0B0A" media="(prefers-color-scheme: dark)" data-for="dark">
<script>
/* Light or dark before the first paint: this device's choice, else the system's. src/lib/theme.ts does the same afterwards. */
(function () {
  var t; try { t = localStorage.getItem("workoutPath.theme"); } catch (e) {}
  if (t !== "light" && t !== "dark") return void (document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.documentElement.dataset.theme = t;
  document.querySelectorAll('meta[name="theme-color"][data-for]').forEach(function (m) { m.media = m.dataset.for === t ? "all" : "not all"; });
})();
</script>
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="manifest" href="./manifest.webmanifest">
<title>Workout Path</title>
</head>
<body>
<div id="root"></div>
<script type="module" src="./src/main.tsx"></script>
</body>
</html>
