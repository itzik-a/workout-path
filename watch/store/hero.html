<!DOCTYPE html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1440px;height:720px;overflow:hidden}
body{background:linear-gradient(135deg,#F97316 0%,#C2410C 100%);font-family:-apple-system,"SF Pro Display","Helvetica Neue",sans-serif;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 110px;box-sizing:border-box}
.left{display:flex;flex-direction:column;gap:26px;max-width:720px}
.brand{display:flex;align-items:center;gap:26px}
.brand svg{width:112px;height:112px}
h1{white-space:nowrap;font-size:80px;font-weight:800;letter-spacing:-1.5px;margin:0;line-height:1}
p{max-width:600px;font-size:36px;line-height:1.3;margin:0;font-weight:500;opacity:.95}
.watch{width:470px;height:470px;border-radius:50%;background:#111;box-shadow:0 0 0 18px #2a2a2a,0 0 0 21px #555,0 30px 60px rgba(0,0,0,.35);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center}
.watch svg.ring{position:absolute;inset:0}
.top{font-size:20px;color:#9a9a9a;position:absolute;top:62px}
.name{font-size:40px;font-weight:700;margin-top:-10px}
.num{font-size:150px;font-weight:700;line-height:1;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.cue{font-size:21px;text-align:center;width:300px;line-height:1.25}
.next{font-size:19px;color:#9a9a9a;position:absolute;bottom:58px}
</style></head><body>
<div class="left">
  <div class="brand">
    <svg viewBox="12 10 40 48"><path d="M19.5 32 C18 22 20 13.5 32 13.5 S46 22 44.5 32" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round"/><circle cx="32" cy="39.5" r="15" fill="#fff"/><rect x="22" y="50.5" width="20" height="4.5" rx="2.25" fill="#fff"/></svg>
    <h1>Workout Path</h1>
  </div>
  <p>Your own workouts on the watch: your exercise names and cues, holds that count down, one press per set.</p>
</div>
<div class="watch">
  <svg class="ring" viewBox="0 0 470 470"><circle cx="235" cy="235" r="222" fill="none" stroke="#262626" stroke-width="12"/><circle cx="235" cy="235" r="222" fill="none" stroke="#E8661C" stroke-width="12" stroke-linecap="round" stroke-dasharray="976 1395" transform="rotate(-90 235 235)"/></svg>
  <div class="top">1 / 5 &nbsp;&nbsp; HR 112</div>
  <div class="name">Active hang</div>
  <div class="num">14</div>
  <div class="cue">Pull the shoulders down, away from the ears</div>
  <div class="next">Next: Rest 15</div>
</div>
</body></html>
